<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Guru – EduBrain</title>
    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d6efd">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .table-responsive { border-radius: 8px; overflow: hidden; }
        .progress { height: 20px; border-radius: 10px; }
    </style>
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="text-center mb-5">
        <h2 class="fw-bold">Dashboard Analisis Guru</h2>
        <p class="text-muted">Pemantauan Capaian Kompetensi & Diagnosa Miskonsepsi</p>
    </div>

    <div id="ringkasanStatistik"></div>

    <div class="card shadow-sm border-0">
        <div class="card-header bg-white py-3">
            <h5 class="mb-0 fw-bold">Detail Capaian Per Indikator</h5>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th style="width: 80px;">No</th>
                            <th>Indikator Kompetensi</th>
                            <th>Status Pemahaman</th>
                            <th>Analisis / Miskonsepsi</th>
                        </tr>
                    </thead>
                    <tbody id="isiRekap">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="mt-4 d-flex justify-content-between">
        <button onclick="window.location.href='index.html'" class="btn btn-outline-secondary">Kembali ke Soal</button>
        <button onclick="resetData()" class="btn btn-danger">Hapus Data Terkini</button>
    </div>
</div>

<script>
    const data = localStorage.getItem("hasilAsesmen");
    const containerTabel = document.getElementById("isiRekap");
    const containerStatistik = document.getElementById("ringkasanStatistik");

    if (!data) {
        containerStatistik.innerHTML = `
            <div class="alert alert-warning text-center shadow-sm">
                Belum ada data pengerjaan yang terekam di sistem ini.
            </div>`;
    } else {
        const hasil = JSON.parse(data);
        const total = hasil.length;
        const benar = hasil.filter(h => h.status).length;
        const persentase = (benar / total) * 100;

        // Render Ringkasan
        containerStatistik.innerHTML = `
            <div class="row mb-4">
                <div class="col-md-4">
                    <div class="card text-center border-0 shadow-sm mb-3">
                        <div class="card-body">
                            <h3 class="fw-bold text-primary">${total}</h3>
                            <small class="text-muted text-uppercase">Total Soal</small>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card text-center border-0 shadow-sm mb-3">
                        <div class="card-body">
                            <h3 class="fw-bold text-success">${benar}</h3>
                            <small class="text-muted text-uppercase">Jawaban Benar</small>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card text-center border-0 shadow-sm mb-3">
                        <div class="card-body">
                            <h3 class="fw-bold text-danger">${total - benar}</h3>
                            <small class="text-muted text-uppercase">Miskonsepsi</small>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="card mb-4 border-0 shadow-sm">
                <div class="card-body">
                    <div class="d-flex justify-content-between mb-2">
                        <span>Tingkat Penguasaan Kelas</span>
                        <span class="fw-bold">${persentase.toFixed(0)}%</span>
                    </div>
                    <div class="progress">
                        <div class="progress-bar ${persentase < 75 ? 'bg-warning' : 'bg-success'}" 
                             role="progressbar" style="width: ${persentase}%"></div>
                    </div>
                </div>
            </div>
        `;

        // Render Baris Tabel
        let barisHtml = "";
        hasil.forEach((item, index) => {
            barisHtml += `
                <tr>
                    <td class="text-center fw-bold">${index + 1}</td>
                    <td>${item.indikator}</td>
                    <td>
                        <span class="badge rounded-pill ${item.status ? 'bg-light text-success border border-success' : 'bg-light text-danger border border-danger'} p-2 px-3">
                            ${item.status ? '● Terkuasai' : '○ Perlu Remedial'}
                        </span>
                    </td>
                    <td><small class="text-muted">${item.catatan}</small></td>
                </tr>
            `;
        });
        containerTabel.innerHTML = barisHtml;
    }

    function resetData() {
        if (confirm("Apakah Anda yakin ingin menghapus data rekapitulasi ini?")) {
            localStorage.removeItem("hasilAsesmen");
            window.location.reload();
        }
    }
</script>
</body>
</html>
